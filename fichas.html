<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas | ATTENDX</title>
    <!--CSS de Bootstrap 5.3.3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria de iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="bg-body-tertiary">
    <!--Menu lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se desliza-->
    <!--desde el lg se muestra normal. offcanvas-start lo hace salir por la izquierda . sidebar es muestra la clase el id el boton q lo abre-->
    <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="menuLateral" aria-labelledby="tituloMenu">
        <!--Encabezado del panel; bootstrap solo lo muestra en celular-->
        <div class="offcanvas-header border-bottom border-secondary">
            <!--Nombre del sistema en el panel movil-->
            <h5 class="offcanvas-tittle" id="tituloMenu"><i class="bi bi-shop me-2"></i>ATTENDX</h5>
            <!--Boton X blanco de ceirre del panel-->
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menuLateral" aria-label="Cerrar menu"></button>
            <!--Cierra el encabezado-->
        </div>
        <!--Cuerpo del menu flexbox en columna para apilar logo enlaces y boton de salida-->
        <div class="offcanvas-body d-flex flex-column p-3">
            <!--logo solo se ve en computador-->
            <a href="dashboard.html" class="d-none d-lg-flex align-items-center mb-3 text-white text-decoration-none fs-5 fw-bold">
                <!--Icono verde y nombre-->
                <i class="bi bi-shop me-2 text-sena"></i>ATTENDX
                <!--Cierra el logo-->
            </a>
            <!--lista de navegacion en columna-->
            <ul class="nav nav-pills flex-column mb-auto">
                <!--Enlace al modulo "DASHBOARD"-->
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <!--Enlace al modulo "USUARIOS" y activo para resaltar en verde-->
                <li class="nav-item"><a href="usuarios.html" class="nav-link"><i class="bi bi-people me-2"></i>Usuarios</a></li>
                <!--Enlace al modulo "FICHAS"-->
                <li class="nav-item"><a href="fichas.html" class="nav-link active" aria-current="page"><i class="bi bi-book me-2"></i>Fichas</a></li>
            </ul>
            <hr>
            <!--boton que vuelve al login asi se cierra la sesion-->
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar Sesion</a>
        </div>
    </aside>
    <div class="contenido">

        <nav>

        </nav>

        <!--contenido de la poagina-->
        <main CLASS="p-3 p-md-4">
            <!--Inicio del contenido-->
            <!--bloque del titulo con margen inferior-->
            <div class="mb-4">
                <!--Titulo de la pagina-->
                <h1 class="h3 mb-1">Fichas</h1>
                <!--subtitulo en gris-->
                <p class="text-secondary mb-0">Bienvenido a la administración de fichas</p>
            </div>

            <!--tarjetas de indicadores-->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-3 mb-4">
                <!--columna 1-->
                <div class="col">
                    <!--tarjeta con nuestra clase franja verde y animacion-->
                    <div class="card tarjetas-kpi shadow-sm h-100">
                        <!--cuerpo con flexbox icono y texto lado a lado separados-->
                        <div class="card-body d-flex align-items-center gap-3">
                            <!--cuadro del icono fondo verde suave icono verde-->
                            <div class="icono-kpi bg-success-subtle text-success"><i class="bi bi-people"></i></div>
                            <div>
                                <!--Nombre del indicador-->
                                <p class="text-secondary small mb-0">Usuarios</p>
                                <!--valor de ejemplo del indicador-->
                                <h2 class="h4 mb-0">24</h2>
                                <!--cierre del bloque de texto-->
                            </div>
                        <!--link estira este enlace sobre toda la tarjeta un cilc en cualquier parte lleva al modulo-->
                        <a href="usuario.html" class="stretched-link" aria-label="ir a usuarios"></a>
                    </div>
                </div>
            </div>
            <!--columna 2-->
            <div class="col">
                    <!--tarjeta con nuestra clase franja verde y animacion-->
                    <div class="card tarjetas-kpi shadow-sm h-100">
                        <!--cuerpo con flexbox icono y texto lado a lado separados-->
                        <div class="card-body d-flex align-items-center gap-3">
                            <!--cuadro del icono fondo verde suave icono verde-->
                            <div class="icono-kpi bg-primary-subtle text-primary"><i class="bi bi-tags"></i></div>
                            <div>
                                <!--Nombre del indicador-->
                                <p class="text-secondary small mb-0">Aprendices</p>
                                <!--valor de ejemplo del indicador-->
                                <h2 class="h4 mb-0">6</h2>
                                <!--cierre del bloque de texto-->
                            </div>
                        <!--link estira este enlace sobre toda la tarjeta un cilc en cualquier parte lleva al modulo-->
                        <a href="categorias.html" class="stretched-link" aria-label="ir a categorias"></a>
                    </div>
                </div>
            </div>
            <!--columna 3-->
            <div class="col">
                    <!--tarjeta con nuestra clase franja verde y animacion-->
                    <div class="card tarjetas-kpi shadow-sm h-100">
                        <!--cuerpo con flexbox icono y texto lado a lado separados-->
                        <div class="card-body d-flex align-items-center gap-3">
                            <!--cuadro del icono fondo verde suave icono verde-->
                            <div class="icono-kpi bg-warning-subtle text-warning-emphasis"><i class="bi bi-diagram-3"></i></div>
                            <div>
                                <!--Nombre del indicador-->
                                <p class="text-secondary small mb-0">Subcategorias</p>
                                <!--valor de ejemplo del indicador-->
                                <h2 class="h4 mb-0">18</h2>
                                <!--cierre del bloque de texto-->
                            </div>
                        <!--link estira este enlace sobre toda la tarjeta un cilc en cualquier parte lleva al modulo-->
                        <a href="subcategoria.html" class="stretched-link" aria-label="ir a subcategoria"></a>
                    </div>
                </div>
            </div>
            <!--columna 4-->
            <div class="col">
                    <!--tarjeta con nuestra clase franja verde y animacion-->
                    <div class="card tarjetas-kpi shadow-sm h-100">
                        <!--cuerpo con flexbox icono y texto lado a lado separados-->
                        <div class="card-body d-flex align-items-center gap-3">
                            <!--cuadro del icono fondo verde suave icono verde-->
                            <div class="icono-kpi bg-danger-subtle text-danger"><i class="bi bi-box-seam"></i></div>
                            <div>
                                <!--Nombre del indicador-->
                                <p class="text-secondary small mb-0">Productos</p>
                                <!--valor de ejemplo del indicador-->
                                <h2 class="h4 mb-0">152</h2>
                                <!--cierre del bloque de texto-->
                            </div>
                        <!--link estira este enlace sobre toda la tarjeta un cilc en cualquier parte lleva al modulo-->
                        <a href="productos.html" class="stretched-link" aria-label="ir a productos"></a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
