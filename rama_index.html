<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ATTENDX </title>
    <!-- CSS de Bootstrap 5.3.3 desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librería de iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Hoja de estilos personalizada -->
    <link href="../competencias.html/CSS/estilos.css" rel="stylesheet">
</head>
<body class="login-fondo">
    <!-- Contenido principal de la página -->
    <main class="login-card">
        <!-- Encabezado del login -->
        <header class="login-encabezado">
            <!-- Icono de la tienda -->
            <i class="bi bi-shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">ATTENDX</h1>
            <p class="text-secondary mb-0">Ingresa tus credenciales para continuar</p>
        </header>

        <form action="dashboard.html" method="get">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="correo"
                       placeholder="sena@correo.com" autocomplete="email" required>
                <label for="correo">
                    <i class="bi bi-envelope me-1"></i>Correo electrónico
                </label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="clave"
                       placeholder="Mínimo 6 caracteres" minlength="6"
                       autocomplete="current-password" required>
                <label for="clave">
                    <i class="bi bi-lock me-1"></i>Contraseña
                </label>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="recordar">
                    <label class="form-check-label" for="recordar">Recordarme</label>
                </div>
                <a href="#" class="small text-decoration-none">¿Olvidó su contraseña?</a>
            </div>

            <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
            </button>
        </form>

        <p class="login-pie">
            ¿No tienes cuenta?
            <a href="registro.html" class="text-decoration-none">Regístrate</a>
        </p>
        <p class="login-pie">
            <a href="../competencias.html/rama_competencias.html" class="text-decoration-none">
            </a>
        </p>
        <footer class="login-pie">2026 SENA </footer>
    </main>
</body>
</html>
