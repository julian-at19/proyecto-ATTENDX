<!DOCTYPE html> <!-- Documento HTML5. -->
<!-- Raíz en español. -->
<html lang="es">
<!-- Cabecera. -->
<head>
    <!-- Codificación UTF-8. -->
    <meta charset="UTF-8">
    <!-- Diseño adaptable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la pestaña. -->
    <title>Crear cuenta | TiendaSENA</title>
    <!-- CSS de Bootstrap. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Íconos. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Nuestros estilos, después de Bootstrap. -->
    <link href="css/estilos.css" rel="stylesheet">
<!-- Cierra la cabecera. -->
</head>
<!-- Mismo fondo y centrado que el login: reutilizamos la clase. -->
<body class="login-fondo">

    <!-- La tarjeta con nuestra clase extra ancha (680px) porque tiene más campos. -->
    <main class="login-card ancha">
        <!-- Encabezado centrado. -->
        <header class="login-encabezado">
            <!-- Ícono de “agregar persona”. -->
            <i class="bi bi-person-plus display-5 text-sena"></i>
            <!-- Título. -->
            <h1 class="h3 fw-bold">Crear cuenta</h1>
            <!-- Instrucción. -->
            <p class="text-secondary mb-0">Completa tus datos para registrarte en TiendaSENA</p>
        <!-- Cierra el encabezado. -->
        </header>

        <!-- Al registrarse vuelve al login. El formulario es una fila de la rejilla (row); g-3 agrega espacio entre columnas y filas. -->
        <form action="index.html" method="get" class="row g-3">
            <!-- Columna: todo el ancho en celular, la mitad desde tablet (6 de 12). -->
            <div class="col-md-6">
                <!-- form-label da el estilo de Bootstrap a la etiqueta. Usamos el prefijo reg para que los id sean únicos. -->
                <label for="regNombres" class="form-label">Nombres</label>
                <!-- Campo obligatorio. -->
                <input type="text" class="form-control" id="regNombres" required>
            <!-- Cierra la columna. -->
            </div>
            <!-- La otra mitad: nombres y apellidos quedan lado a lado. -->
            <div class="col-md-6">
                <!-- Etiqueta. -->
                <label for="regApellidos" class="form-label">Apellidos</label>
                <!-- Campo obligatorio. -->
                <input type="text" class="form-control" id="regApellidos" required>
            <!-- Cierra la columna. -->
            </div>
            <!-- Un tercio (4 de 12). -->
            <div class="col-md-4">
                <!-- Etiqueta. -->
                <label for="regTipoDoc" class="form-label">Tipo de documento</label>
                <!-- Lista desplegable con estilo Bootstrap (form-select). -->
                <select class="form-select" id="regTipoDoc">
                    <!-- Cada <option> es una opción; value es lo que se enviaría. -->
                    <option value="CC">Cédula de ciudadanía</option>
                    <!-- Opción. -->
                    <option value="TI">Tarjeta de identidad</option>
                    <!-- Opción. -->
                    <option value="CE">Cédula de extranjería</option>
                <!-- Cierra la lista. -->
                </select>
            <!-- Cierra la columna. -->
            </div>
            <!-- Dos tercios (4 + 8 = 12: la fila se completa). -->
            <div class="col-md-8">
                <!-- Etiqueta. -->
                <label for="regDocumento" class="form-label">Número de documento</label>
                <!-- inputmode="numeric" muestra el teclado numérico en el celular. -->
                <input type="text" class="form-control" id="regDocumento" inputmode="numeric" required>
            <!-- Cierra la columna. -->
            </div>
            <!-- Todo el ancho en cualquier pantalla. -->
            <div class="col-12">
                <!-- Etiqueta. -->
                <label for="regCorreo" class="form-label">Correo electrónico</label>
                <!-- Correo con validación del navegador. -->
                <input type="email" class="form-control" id="regCorreo" placeholder="nombre@correo.com" required>
            <!-- Cierra la columna. -->
            </div>
            <!-- Mitad. -->
            <div class="col-md-6">
                <!-- Etiqueta. -->
                <label for="regClave" class="form-label">Contraseña</label>
                <!-- Mínimo 6 caracteres. -->
                <input type="password" class="form-control" id="regClave" minlength="6" required>
            <!-- Cierra la columna. -->
            </div>
            <!-- Mitad. -->
            <div class="col-md-6">
                <!-- Etiqueta. -->
                <label for="regConfirmar" class="form-label">Confirmar contraseña</label>
                <!-- Que coincidan se validará con JavaScript en el sistema real. -->
                <input type="password" class="form-control" id="regConfirmar" minlength="6" required>
            <!-- Cierra la columna. -->
            </div>
            <!-- Todo el ancho. -->
            <div class="col-12">
                <!-- Casilla de Bootstrap. -->
                <div class="form-check">
                    <!-- Casilla obligatoria: sin marcarla no se puede enviar. -->
                    <input class="form-check-input" type="checkbox" id="regTerminos" required>
                    <!-- Texto de la casilla. -->
                    <label class="form-check-label" for="regTerminos">Acepto el tratamiento de mis datos personales</label>
                <!-- Cierra la casilla. -->
                </div>
            <!-- Cierra la columna. -->
            </div>
            <!-- Todo el ancho. -->
            <div class="col-12">
                <!-- El mismo botón del login: así el diseño es consistente. -->
                <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                    <!-- Ícono y texto. -->
                    <i class="bi bi-check2-circle me-1"></i> Crear cuenta
                <!-- Cierra el botón. -->
                </button>
            <!-- Cierra la columna. -->
            </div>
        <!-- Cierra el formulario (y la fila). -->
        </form>

        <!-- Enlace de regreso al login: la navegación funciona en ambos sentidos. -->
        <p class="login-pie">¿Ya tienes cuenta? <a href="index.html" class="text-decoration-none">Inicia sesión</a></p>
    <!-- Cierra la tarjeta. -->
    </main>

<!-- Cierra el cuerpo. -->
</body>
<!-- Cierra el documento. -->
</html>
